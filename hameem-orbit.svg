<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="340"
     viewBox="0 0 1200 340"
     role="img"
     aria-labelledby="title description">

  <title id="title">Hi, I am Hameem.</title>
  <desc id="description">
    People know me as Hameem Bhai.
    A dark starfield with luminous pink orbital rings.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="60%" stop-color="#140c19"/>
      <stop offset="100%" stop-color="#260e22"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#be185d" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#831843" stop-opacity=".12"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity=".85"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#831843" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09090f" stop-opacity=".85"/>
      <stop offset="65%" stop-color="#09090f" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="340" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="340" fill="url(#background)"/>

    <ellipse cx="940" cy="170" rx="340" ry="230" fill="url(#glow)"/>

    <!-- Distant stars -->
    <g fill="#fce7f3">
      <circle cx="45" cy="51" r="1" opacity=".45"/>
      <circle cx="142" cy="279" r="1.1" opacity=".35"/>
      <circle cx="231" cy="43" r=".8" opacity=".5"/>
      <circle cx="367" cy="83" r="1" opacity=".3"/>
      <circle cx="492" cy="35" r="1.2" opacity=".45"/>
      <circle cx="567" cy="293" r=".8" opacity=".35"/>
      <circle cx="638" cy="63" r="1" opacity=".6"/>
      <circle cx="698" cy="242" r="1.2" opacity=".4"/>
      <circle cx="731" cy="30" r=".8" opacity=".6"/>
      <circle cx="788" cy="302" r="1" opacity=".5"/>
      <circle cx="844" cy="56" r="1.3" opacity=".6"/>
      <circle cx="901" cy="274" r=".8" opacity=".45"/>
      <circle cx="977" cy="37" r="1.1" opacity=".7"/>
      <circle cx="1038" cy="284" r="1.3" opacity=".6"/>
      <circle cx="1103" cy="159" r=".8" opacity=".5"/>
      <circle cx="1158" cy="65" r="1.2" opacity=".7"/>
      <circle cx="1174" cy="303" r=".8" opacity=".4"/>
    </g>

    <!-- Orbital paths -->
    <g fill="none" stroke="url(#orbit)">
      <ellipse cx="908" cy="172" rx="328" ry="92"
               transform="rotate(-25 908 172)" stroke-width="1.5"/>
      <ellipse cx="908" cy="172" rx="280" ry="128"
               transform="rotate(24 908 172)" stroke-width="1"/>
      <ellipse cx="908" cy="172" rx="218" ry="151"
               transform="rotate(-57 908 172)" stroke-width=".9"/>
    </g>

    <!-- Orbiting light -->
    <circle cx="1124" cy="70" r="12"
            fill="#f472b6" opacity=".7" filter="url(#softGlow)"/>
    <circle cx="1124" cy="70" r="3.2" fill="#fdf2f8"/>

    <!-- Subtle planetary glow -->
    <circle cx="908" cy="172" r="48"
            fill="#ec4899" opacity=".08" filter="url(#softGlow)"/>
    <circle cx="908" cy="172" r="29"
            fill="none" stroke="#f472b6" stroke-opacity=".15"/>

    <!-- Contrast behind text -->
    <rect width="820" height="340" fill="url(#fade)"/>

    <rect x="78" y="92" width="35" height="3" rx="1.5" fill="#f472b6"/>

    <text x="78" y="164"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="54"
          font-weight="700"
          fill="#fff1f7">Hi, I am Hameem.</text>

    <text x="81" y="210"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="23"
          fill="#f9a8d4">People know me as Hameem Bhai.</text>

    <text x="82" y="267"
          font-family="Consolas, monospace"
          font-size="12"
          letter-spacing="2.4"
          fill="#bda5b7">CURIOUS MIND. IDEAS IN MOTION.</text>
  </g>

  <rect x=".5" y=".5" width="1199" height="339" rx="20"
        fill="none" stroke="#f472b6" stroke-opacity=".16"/>
</svg>
